[package]
name = "stream-painter"
version = "0.5.1"
edition = "2021"
description = "A local drawing overlay for OBS Studio"
license = "MIT"
repository = "https://github.com/yuniruyuni/StreamPainter"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
toml = "1.0"
uuid = { version = "1", features = ["v7"] }
image = { version = "0.25", default-features = false, features = ["png"] }
tracing = "0.1"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tokio = { version = "1", features = ["rt", "macros", "time", "net", "sync", "fs"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
axum = { version = "0.8", features = ["ws"] }
rust-embed = { version = "8", features = ["include-exclude"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(windows)'.dependencies]
known-folders = "1.4.2"
windows-numerics = "0.3"

[target.'cfg(windows)'.dependencies.windows]
version = "0.62"
features = [
  "Win32_Foundation",
  "Win32_Graphics_Direct2D",
  "Win32_Graphics_Direct2D_Common",
  "Win32_Graphics_Direct3D",
  "Win32_Graphics_Direct3D11",
  "Win32_Graphics_DirectComposition",
  "Win32_Graphics_DirectWrite",
  "Win32_Graphics_Dxgi",
  "Win32_Graphics_Dxgi_Common",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_Security",
  "Win32_Security_Credentials",
  "Win32_System_DataExchange",
  "Win32_System_LibraryLoader",
  "Win32_System_Memory",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_HiDpi",
  "Win32_UI_Controls_Dialogs",
  "Win32_UI_Input_KeyboardAndMouse",
  "Win32_UI_Input_Pointer",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
]

# build script はホスト用にコンパイルされるため無条件依存にする
# (ターゲット判定は build.rs 内の CARGO_CFG_WINDOWS で行う)
[build-dependencies]
embed-manifest = "1.4"

[profile.release]
lto = true
strip = true
