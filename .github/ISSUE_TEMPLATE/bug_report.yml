name: バグ報告
description: 再現可能な不具合を報告します
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        セキュリティ上の問題は公開Issueへ書かず、Securityタブの「Report a vulnerability」から報告してください。
  - type: input
    id: version
    attributes:
      label: StreamPainterのバージョン
      description: Release名またはコミットSHAを記入してください。
      placeholder: v0.1.0
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 環境
      description: Windows、OBS Studio、GPUのバージョンを記入してください。
      placeholder: Windows 11 24H2 / OBS Studio 32.x / NVIDIA ...
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 再現手順
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期待した結果
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 実際の結果
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: ログと補足
      description: |
        タスクトレイの「ログフォルダー...」から取得できます。ユーザー名やパスなど、
        公開したくない情報が含まれていないか確認してから貼り付けてください。
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: 確認
      options:
        - label: 最新リリースまたはmainで再現することを確認しました。
          required: true
        - label: 同じ内容のIssueがないことを確認しました。
          required: true
