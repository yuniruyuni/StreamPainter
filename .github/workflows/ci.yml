name: CI

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release ancestry verification
        run: bash scripts/test-verify-release-on-main.sh

      - name: Test release signing helpers
        shell: pwsh
        run: ./scripts/windows/test-release-signing.ps1

      - name: Test pen validation helpers
        shell: pwsh
        run: ./scripts/windows/test-pen-validation.ps1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: painter

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate embedded application assets
        run: bun run prepare:painter

      - name: Check Rust formatting
        working-directory: painter
        run: cargo fmt --check

      - name: Run platform-independent Rust tests
        working-directory: painter
        run: cargo test --locked
