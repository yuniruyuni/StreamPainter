name: Release

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write

    steps:
      - name: Checkout tagged source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Check frontend
        run: bun run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: painter

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate embedded application assets
        run: bun run prepare:painter

      - name: Format check
        working-directory: painter
        run: cargo fmt --check

      - name: Clippy
        working-directory: painter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: painter
        run: cargo test --locked

      - name: Build release executable
        working-directory: painter
        run: cargo build --release --locked

      - name: Verify version and package assets
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $ErrorActionPreference = "Stop"
          if ($env:RELEASE_TAG -notmatch '^v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)$') {
            throw "Release tag is not strict SemVer: $env:RELEASE_TAG"
          }

          $metadata = cargo metadata --manifest-path painter/Cargo.toml --no-deps --format-version 1 |
            ConvertFrom-Json
          $package = $metadata.packages | Where-Object { $_.name -eq "stream-painter" }
          if ($null -eq $package) {
            throw "stream-painter package was not found"
          }
          if ("v$($package.version)" -ne $env:RELEASE_TAG) {
            throw "Tag $env:RELEASE_TAG does not match Cargo version v$($package.version)"
          }

          New-Item -ItemType Directory -Force dist | Out-Null
          $asset = "StreamPainter-$env:RELEASE_TAG-windows-x64.exe"
          Copy-Item painter/target/release/stream-painter.exe "dist/$asset"
          $hash = (Get-FileHash "dist/$asset" -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "dist/$asset.sha256" -Value "$hash  $asset" -Encoding ascii

      - name: Retain packaged assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stream-painter-release-${{ github.ref_name }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $asset = "StreamPainter-$env:RELEASE_TAG-windows-x64.exe"
          gh release create $env:RELEASE_TAG `
            "dist/$asset#StreamPainter for Windows x64" `
            "dist/$asset.sha256#SHA-256 checksum" `
            --verify-tag `
            --generate-notes `
            --fail-on-no-commits `
            --title "StreamPainter $env:RELEASE_TAG"
