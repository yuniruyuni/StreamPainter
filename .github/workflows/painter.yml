name: Windows application

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "scripts/**"
      - "about.toml"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
      - ".gitattributes"
      - ".github/workflows/painter.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "scripts/**"
      - "about.toml"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
      - ".gitattributes"
      - ".github/workflows/painter.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.12

      - name: Install and check frontend dependencies
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          toolchain: 1.94.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: painter

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate embedded application assets
        run: bun run prepare:painter

      - name: Format check
        working-directory: painter
        run: cargo fmt --check

      - name: Clippy
        working-directory: painter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: painter
        run: cargo test --locked

      - name: Build single-file application
        working-directory: painter
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: stream-painter-windows-x64
          path: painter/target/release/stream-painter.exe
