name: Windows application

permissions:
  contents: read

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/painter.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "package.json"
      - "bun.lock"
      - ".github/workflows/painter.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.12

      - name: Build embedded OBS overlay
        run: |
          bun install --frozen-lockfile
          bun run check
          bun run build

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: painter

      - name: Format check
        working-directory: painter
        run: cargo fmt --check

      - name: Clippy
        working-directory: painter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: painter
        run: cargo test --locked

      - name: Build single-file application
        working-directory: painter
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: stream-painter-windows-x64
          path: painter/target/release/stream-painter.exe
