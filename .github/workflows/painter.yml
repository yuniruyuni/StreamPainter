name: Windows application

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "scripts/**"
      - "about.toml"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - ".github/workflows/painter.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "client/**"
      - "painter/**"
      - "scripts/**"
      - "about.toml"
      - "LICENSE"
      - "package.json"
      - "bun.lock"
      - "rust-toolchain.toml"
      - ".gitattributes"
      - ".github/workflows/painter.yml"

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Test release signing helpers
        shell: pwsh
        run: ./scripts/windows/test-release-signing.ps1

      - name: Test pen validation helpers on PowerShell 7
        shell: pwsh
        run: ./scripts/windows/test-pen-validation.ps1

      - name: Test pen validation helpers on Windows PowerShell 5.1
        shell: powershell
        run: ./scripts/windows/test-pen-validation.ps1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      - name: Install and check frontend dependencies
        run: |
          bun install --frozen-lockfile
          bun run check

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: 1.97.1
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2
        with:
          workspaces: painter

      - name: Install cargo-about
        run: cargo install cargo-about --version 0.9.1 --locked --features cli

      - name: Generate embedded application assets
        run: bun run prepare:painter

      - name: Format check
        working-directory: painter
        run: cargo fmt --check

      - name: Clippy
        working-directory: painter
        run: cargo clippy --all-targets --locked -- -D warnings

      - name: Test
        working-directory: painter
        run: cargo test --locked

      - name: Build single-file application
        working-directory: painter
        run: cargo build --release --locked

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: stream-painter-windows-x64
          path: painter/target/release/stream-painter.exe
